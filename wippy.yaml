organization: chicago
module: weather
description: Weather for the Chicago desktop — a window with the current weather, the week's forecast and a city search, the temperature in the tray next to the clock, and a desktop widget; data from Open-Meteo, no key needed.
license: MIT
repository: https://github.com/chicago-desktop/weather
homepage: https://wippy.ai
keywords:
  - kickside
  - tui
  - terminal
  - desktop
  - weather
  - chicago
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
# The image pack lives outside src/ and is packed only when named here.
embed:
  - chicago.weather:images
